server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false
spring.datasource.url=${ADMIN_DB_URL:jdbc:postgresql://127.0.0.1:55432/forest_arena_dev}
spring.datasource.username=${ADMIN_DB_USER:forest_arena_admin_web}
spring.datasource.password=${ADMIN_DB_PASSWORD:}
admin.key-file=${ADMIN_KEY_FILE:${user.home}/Library/Application Support/ForestArena/admin/keys.json}
admin.game-api-url=${GAME_API_URL:http://127.0.0.1:3000}
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
