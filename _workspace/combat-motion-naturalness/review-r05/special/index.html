<!doctype html><meta charset="utf-8"><title>자현 특수기 표시 크기</title><style>body{background:#14281f;color:#f3fff1;font:16px/1.6 system-ui;padding:24px}video{width:46%;margin:1%}button{padding:14px;font:inherit}img{max-width:100%}</style><h1>자현 특수기 · 원화 그대로 전체 배율 +18%</h1><p>준비·휘두르기·회수 시간과 판정은 유지됩니다. 승인 전 후보입니다.</p><button onclick="playAll(1)">1배속 처음부터</button><button onclick="playAll(.5)">0.5배속 처음부터</button><span id="status">준비</span><h2>기존 / 후보</h2><video controls muted playsinline preload="auto" src="before.mp4"></video><video id="candidate" controls muted playsinline preload="auto" src="candidate.mp4"></video><h2>작은 좌우반전 화면</h2><video controls muted playsinline preload="auto" src="small-flipped.mp4"></video><h2>진입·복귀 같은 시점</h2><img src="entry-exit-before-after.jpg"><script>function playAll(rate){document.querySelectorAll('video').forEach(v=>{if(v.readyState>=2){v.pause();v.currentTime=0;v.playbackRate=rate;v.play()}});document.getElementById('status').textContent=rate+'배속 재생중'}document.getElementById('candidate').addEventListener('ended',()=>{document.getElementById('status').textContent=document.getElementById('candidate').playbackRate+'배속 완료'})</script>
