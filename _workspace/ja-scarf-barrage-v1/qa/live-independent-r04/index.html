<!doctype html><meta charset="utf-8"><title>자현 특수 r04 실제 게임 독립 검토</title><style>body{background:#16252b;color:white;font:16px system-ui;margin:12px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%}button,select{font:18px system-ui;padding:8px;margin:5px}output{display:block}</style><h1>자현 특수 r04 — 실제60Hz 입력120틱</h1><button id="restart">처음부터 모두 재생</button><label>속도<select id="speed"><option value="1">정상 1배속</option><option value="0.25">느린0.25배속</option></select></label><main><section><h2>정상 방향 / 줌1.5</h2><video id="normal" controls muted playsinline src="../live-normal-r04/ja-hyun__special.mp4"></video><output id="normal-time"></output></section><section><h2>좌우 반전·소형 / 줌0.75</h2><video id="mirror" controls muted playsinline src="../live-mirror-small-r04/ja-hyun__special.mp4"></video><output id="mirror-time"></output></section></main><p>원화32장과 준비→1초연타→회복→대기 전환. 화면 비교판은 무손실 영상240틱 전체에서 별도 생성했다.</p><script>const videos=[...document.querySelectorAll('video')];document.querySelector('#restart').onclick=()=>videos.forEach(v=>{v.currentTime=0;v.play()});document.querySelector('#speed').onchange=e=>videos.forEach(v=>v.playbackRate=+e.target.value);setInterval(()=>videos.forEach(v=>document.querySelector('#'+v.id+'-time').textContent=v.currentTime.toFixed(3)+' / '+v.duration+' 초 | '+v.playbackRate+'배속 | 종료 '+v.ended),50)</script>
