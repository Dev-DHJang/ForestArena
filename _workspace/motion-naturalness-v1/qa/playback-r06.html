<!doctype html><html lang="ko"><meta charset="utf-8"><title>독립 QA 실제 재생 6종</title><style>body{background:#18282e;color:white;font:14px system-ui;margin:10px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}video{width:100%}button{font:inherit;padding:8px}h2{font-size:14px;margin:4px}p{margin:4px}</style><h1 style="font-size:18px">독립 QA 실제 전체 재생 · 사용자 승인 아님</h1><button id="normal">6개 처음부터 정상 재생</button><button id="slow">6개 처음부터 0.25배 재생</button><main></main><script>
const names=['ja-hyun__run-stop','ja-hyun__jump-land','ja-hyun__full-combo','nabi__run-stop','nabi__jump-land','nabi__full-combo'];const folder=new URLSearchParams(location.search).get('mirror')?'live-pilot-mirror-r06':'live-pilot-r06';for(const name of names){const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><video muted playsinline preload="auto" src="../review/${folder}/${name}.mp4"></video><p class="state"></p>`;document.querySelector('main').append(a)}function run(rate){document.querySelectorAll('video').forEach(v=>{v.currentTime=0;v.playbackRate=rate;v.play()})}document.querySelector('#normal').onclick=()=>run(1);document.querySelector('#slow').onclick=()=>run(.25);setInterval(()=>document.querySelectorAll('article').forEach(a=>{const v=a.querySelector('video');a.querySelector('.state').textContent=`${v.currentTime.toFixed(3)} / ${Number(v.duration).toFixed(3)}초 · ${v.playbackRate}배 · ${v.ended?'끝까지 재생됨':v.paused?'정지':'재생 중'}`}),50);
</script></html>
